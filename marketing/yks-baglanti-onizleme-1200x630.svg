      <tspan x="0" y="62">hangi sırayla</tspan>
      <tspan x="0" y="124" fill="#3b4fdb">girebilirsin?</tspan>
    </text>
    <text fill="#545b6a" font-size="20" letter-spacing="-0.1">
      <tspan x="0" y="180">2025 başarı sıralamaları, kontenjan ve ücret bilgisi</tspan>
      <tspan x="0" y="212">tek ekranda. Tercih listeni kur, bağlantıyla paylaş.</tspan>
    </text>

    <g transform="translate(0,258)">
      <text x="0" y="0" fill="#171a21" font-size="27" font-weight="700">653</text>
      <text x="0" y="24" fill="#6f7787" font-size="15">bölüm</text>
      <text x="128" y="0" fill="#171a21" font-size="27" font-weight="700">22.495</text>
      <text x="128" y="24" fill="#6f7787" font-size="15">program kaydı</text>
      <text x="316" y="0" fill="#171a21" font-size="27" font-weight="700">81</text>
      <text x="316" y="24" fill="#6f7787" font-size="15">il</text>
