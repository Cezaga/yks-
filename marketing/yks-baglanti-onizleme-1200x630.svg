      <text x="34" y="29" text-anchor="middle" fill="#9aa1b1" font-size="16">+</text>
      <text x="58" y="23" fill="#171a21" font-size="17" font-weight="600">Diş Hekimliği</text>
      <text x="58" y="41" fill="#6f7787" font-size="13.5">BURSA · BURSA ULUDAĞ ÜNİVERSİTESİ</text>
      <text x="454" y="31" text-anchor="end" fill="#171a21" font-size="19" font-weight="700">27.058</text>
