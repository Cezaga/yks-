      <text x="58" y="23" fill="#171a21" font-size="17" font-weight="600">Bilgisayar Müh. (İngilizce)</text>
      <text x="58" y="41" fill="#6f7787" font-size="13.5">ANKARA · ORTA DOĞU TEKNİK ÜNİVERSİTESİ</text>
      <text x="454" y="31" text-anchor="end" fill="#171a21" font-size="19" font-weight="700">1.204</text>
