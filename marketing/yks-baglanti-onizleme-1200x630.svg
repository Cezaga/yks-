    <path d="M0 16 a16 16 0 0 1 16 -16 h444 a16 16 0 0 1 16 16 v2 h-476 z" fill="#3364c9"/>
    <rect x="1" y="18" width="474" height="46" fill="#f2f5fc"/>
    <g transform="translate(22,31)">
