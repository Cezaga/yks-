    <text x="68" y="22" fill="#171a21" font-size="21" font-weight="600" letter-spacing="-0.3">Tercih Aracı</text>
    <text x="68" y="44" fill="#6f7787" font-size="15.5">Üniversite bölüm sıralamaları</text>
  </g>

  <!-- sol: metin -->
