    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1150" cy="60" r="190" fill="#4f66ef" opacity="0.06"/>

  <!-- marka -->
  <g transform="translate(64,56)">
