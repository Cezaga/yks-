<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f66ef"/>
      <stop offset="1" stop-color="#3b4fdb"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#101318" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101318" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- köşede soluk marka lekesi -->
  <circle cx="1010" cy="90" r="230" fill="#4f66ef" opacity="0.06"/>

  <!-- ============ üst: marka ============ -->
  <g transform="translate(80,78)">
    <rect width="62" height="62" rx="16" fill="url(#brandGrad)"/>
    <text x="31" y="39" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700" letter-spacing="0.5">YKS</text>
    <text x="80" y="26" fill="#171a21" font-size="25" font-weight="600" letter-spacing="-0.3">Tercih Aracı</text>
    <text x="80" y="52" fill="#6f7787" font-size="18">Üniversite bölüm sıralamaları</text>
  </g>

  <!-- ücretsiz rozeti -->
  <g transform="translate(786,88)">
    <rect width="214" height="42" rx="21" fill="#ffffff" stroke="#c3d0fe"/>
    <circle cx="28" cy="21" r="5" fill="#30a46c"/>
    <text x="46" y="27" fill="#2f3eb3" font-size="17" font-weight="600">Tamamen ücretsiz</text>
  </g>

  <!-- ============ başlık ============ -->
  <g transform="translate(80,238)">
    <text fill="#171a21" font-size="72" font-weight="700" letter-spacing="-2.4">
      <tspan x="0" y="0">Hangi bölüme,</tspan>
      <tspan x="0" y="86">hangi sırayla</tspan>
      <tspan x="0" y="172" fill="#3b4fdb">girebilirsin?</tspan>
    </text>
    <text fill="#545b6a" font-size="26" letter-spacing="-0.2">
      <tspan x="0" y="238">İl ve bölüm seç; 2025 başarı sıralamalarını yan yana gör,</tspan>
      <tspan x="0" y="276">tercih listeni kur, tek bağlantıyla arkadaşlarına gönder.</tspan>
    </text>
  </g>

  <!-- ============ arayüz maketi ============ -->
  <g transform="translate(80,610)" filter="url(#cardShadow)">
    <rect width="920" height="196" rx="18" fill="#ffffff" stroke="#dfe2e8"/>
    <!-- alan başlığı şeridi -->
    <path d="M0 18 a18 18 0 0 1 18 -18 h884 a18 18 0 0 1 18 18 v2 h-920 z" fill="#3364c9"/>
    <rect x="1" y="20" width="918" height="52" fill="#f2f5fc"/>
    <g transform="translate(26,36)">
      <rect width="54" height="24" rx="6" fill="#3364c9"/>
      <text x="27" y="17" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">SAY</text>
      <text x="70" y="18" fill="#171a21" font-size="20" font-weight="600">Sayısal</text>
    </g>
    <text x="894" y="54" text-anchor="end" fill="#6f7787" font-size="15">2025 SIRA</text>

    <!-- satır 1 -->
    <g transform="translate(0,72)">
      <rect x="26" y="14" width="28" height="28" rx="7" fill="#4f66ef"/>
      <text x="40" y="34" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">★</text>
      <text x="72" y="26" fill="#171a21" font-size="21" font-weight="600">Tıp</text>
      <text x="72" y="47" fill="#6f7787" font-size="16">ADANA · ÇUKUROVA ÜNİVERSİTESİ</text>
      <text x="894" y="36" text-anchor="end" fill="#171a21" font-size="24" font-weight="700">9.624</text>
      <line x1="26" y1="60" x2="894" y2="60" stroke="#eceef2"/>
    </g>
    <!-- satır 2 -->
    <g transform="translate(0,132)">
      <rect x="26" y="14" width="28" height="28" rx="7" fill="#ffffff" stroke="#dfe2e8"/>
      <text x="40" y="34" text-anchor="middle" fill="#9aa1b1" font-size="19">+</text>
      <text x="72" y="26" fill="#171a21" font-size="21" font-weight="600">Bilgisayar Mühendisliği (İngilizce)</text>
      <text x="72" y="47" fill="#6f7787" font-size="16">ANKARA · ORTA DOĞU TEKNİK ÜNİVERSİTESİ</text>
      <text x="894" y="36" text-anchor="end" fill="#171a21" font-size="24" font-weight="700">1.204</text>
    </g>
  </g>

  <!-- ============ sayılar ============ -->
  <g transform="translate(80,892)">
    <g>
      <text x="0" y="0" fill="#171a21" font-size="38" font-weight="700">653</text>
      <text x="0" y="30" fill="#6f7787" font-size="18">bölüm</text>
    </g>
    <g transform="translate(180,0)">
      <text x="0" y="0" fill="#171a21" font-size="38" font-weight="700">22.495</text>
      <text x="0" y="30" fill="#6f7787" font-size="18">program kaydı</text>
    </g>
    <g transform="translate(450,0)">
      <text x="0" y="0" fill="#171a21" font-size="38" font-weight="700">81</text>
      <text x="0" y="30" fill="#6f7787" font-size="18">il</text>
    </g>
    <g transform="translate(590,0)">
      <text x="0" y="0" fill="#171a21" font-size="38" font-weight="700">2021–2025</text>
      <text x="0" y="30" fill="#6f7787" font-size="18">sıralama geçmişi</text>
    </g>
  </g>

  <line x1="80" y1="952" x2="1000" y2="952" stroke="#dfe2e8"/>

  <!-- ============ alt: adres ============ -->
  <g transform="translate(80,988)">
    <rect width="404" height="56" rx="28" fill="url(#brandGrad)" filter="url(#softShadow)"/>
    <text x="202" y="36" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="600" letter-spacing="-0.2">yks-seven.vercel.app</text>
  </g>
  <text x="1000" y="1024" text-anchor="end" fill="#6f7787" font-size="18">Kayıt yok · Reklam yok · Telefonda da çalışır</text>
</svg>
