<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#e7ecff"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f66ef"/>
      <stop offset="1" stop-color="#3b4fdb"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#101318" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="1030" cy="180" r="300" fill="#4f66ef" opacity="0.06"/>
  <circle cx="60" cy="1560" r="260" fill="#4f66ef" opacity="0.05"/>

  <!-- Yerleşim, Instagram/WhatsApp hikâye güvenli alanına göre: üstte ~250px
       ve altta ~250px platformun kendi arayüzü (profil satırı, mesaj çubuğu)
       tarafından kapatılıyor, oralara içerik konmuyor. -->

  <!-- marka -->
  <g transform="translate(90,280)">
    <rect width="76" height="76" rx="20" fill="url(#brandGrad)"/>
    <text x="38" y="48" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="0.5">YKS</text>
    <text x="98" y="32" fill="#171a21" font-size="31" font-weight="600" letter-spacing="-0.4">Tercih Aracı</text>
    <text x="98" y="63" fill="#6f7787" font-size="22">Üniversite bölüm sıralamaları</text>
  </g>

  <!-- başlık -->
  <g transform="translate(90,470)">
    <text fill="#171a21" font-size="86" font-weight="700" letter-spacing="-3">
      <tspan x="0" y="0">Hangi bölüme,</tspan>
      <tspan x="0" y="104">hangi sırayla</tspan>
      <tspan x="0" y="208" fill="#3b4fdb">girebilirsin?</tspan>
    </text>
    <text fill="#545b6a" font-size="31" letter-spacing="-0.2">
      <tspan x="0" y="292">İl ve bölüm seç; 2025 başarı sıralamalarını</tspan>
      <tspan x="0" y="338">yan yana gör, tercih listeni kur,</tspan>
      <tspan x="0" y="384">tek bağlantıyla paylaş.</tspan>
    </text>
  </g>

  <!-- arayüz maketi -->
  <g transform="translate(90,900)" filter="url(#cardShadow)">
    <rect width="900" height="376" rx="22" fill="#ffffff" stroke="#dfe2e8"/>
    <path d="M0 22 a22 22 0 0 1 22 -22 h856 a22 22 0 0 1 22 22 v3 h-900 z" fill="#3364c9"/>
    <rect x="1" y="25" width="898" height="62" fill="#f2f5fc"/>
    <g transform="translate(30,43)">
      <rect width="62" height="27" rx="7" fill="#3364c9"/>
      <text x="31" y="19" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">SAY</text>
      <text x="80" y="21" fill="#171a21" font-size="24" font-weight="600">Sayısal</text>
    </g>
    <text x="870" y="65" text-anchor="end" fill="#6f7787" font-size="18">2025 SIRA</text>

    <g transform="translate(0,87)">
      <rect x="30" y="16" width="32" height="32" rx="8" fill="#4f66ef"/>
      <text x="46" y="39" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">★</text>
      <text x="80" y="30" fill="#171a21" font-size="24" font-weight="600">Tıp</text>
      <text x="80" y="54" fill="#6f7787" font-size="18">ADANA · ÇUKUROVA ÜNİVERSİTESİ</text>
      <text x="870" y="41" text-anchor="end" fill="#171a21" font-size="27" font-weight="700">9.624</text>
      <line x1="30" y1="70" x2="870" y2="70" stroke="#eceef2"/>
    </g>
    <g transform="translate(0,157)">
      <rect x="30" y="16" width="32" height="32" rx="8" fill="#ffffff" stroke="#dfe2e8"/>
      <text x="46" y="39" text-anchor="middle" fill="#9aa1b1" font-size="21">+</text>
      <text x="80" y="30" fill="#171a21" font-size="24" font-weight="600">Bilgisayar Müh. (İngilizce)</text>
      <text x="80" y="54" fill="#6f7787" font-size="18">ANKARA · ORTA DOĞU TEKNİK ÜNİVERSİTESİ</text>
      <text x="870" y="41" text-anchor="end" fill="#171a21" font-size="27" font-weight="700">1.204</text>
      <line x1="30" y1="70" x2="870" y2="70" stroke="#eceef2"/>
    </g>
    <g transform="translate(0,227)">
      <rect x="30" y="16" width="32" height="32" rx="8" fill="#ffffff" stroke="#dfe2e8"/>
      <text x="46" y="39" text-anchor="middle" fill="#9aa1b1" font-size="21">+</text>
      <text x="80" y="30" fill="#171a21" font-size="24" font-weight="600">Diş Hekimliği</text>
      <text x="80" y="54" fill="#6f7787" font-size="18">BURSA · BURSA ULUDAĞ ÜNİVERSİTESİ</text>
      <text x="870" y="41" text-anchor="end" fill="#171a21" font-size="27" font-weight="700">27.058</text>
      <line x1="30" y1="70" x2="870" y2="70" stroke="#eceef2"/>
    </g>
    <g transform="translate(0,297)">
      <rect x="30" y="16" width="32" height="32" rx="8" fill="#ffffff" stroke="#dfe2e8"/>
      <text x="46" y="39" text-anchor="middle" fill="#9aa1b1" font-size="21">+</text>
      <text x="80" y="30" fill="#171a21" font-size="24" font-weight="600">Eczacılık</text>
      <text x="80" y="54" fill="#6f7787" font-size="18">İZMİR · EGE ÜNİVERSİTESİ</text>
      <text x="870" y="41" text-anchor="end" fill="#171a21" font-size="27" font-weight="700">37.783</text>
    </g>
  </g>

  <!-- sayılar -->
  <g transform="translate(90,1380)">
    <g>
      <text x="0" y="0" fill="#171a21" font-size="46" font-weight="700">653</text>
      <text x="0" y="36" fill="#6f7787" font-size="22">bölüm</text>
    </g>
    <g transform="translate(210,0)">
      <text x="0" y="0" fill="#171a21" font-size="46" font-weight="700">22.495</text>
      <text x="0" y="36" fill="#6f7787" font-size="22">program kaydı</text>
    </g>
    <g transform="translate(530,0)">
      <text x="0" y="0" fill="#171a21" font-size="46" font-weight="700">81</text>
      <text x="0" y="36" fill="#6f7787" font-size="22">il</text>
    </g>
    <g transform="translate(680,0)">
      <text x="0" y="0" fill="#171a21" font-size="46" font-weight="700">2021–2025</text>
      <text x="0" y="36" fill="#6f7787" font-size="22">geçmiş</text>
    </g>
  </g>

  <line x1="90" y1="1478" x2="990" y2="1478" stroke="#dfe2e8"/>

  <!-- alt: adres -->
  <g transform="translate(90,1518)">
    <rect width="900" height="86" rx="43" fill="url(#brandGrad)" filter="url(#cardShadow)"/>
    <text x="450" y="55" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="600" letter-spacing="-0.3">yks-seven.vercel.app</text>
  </g>
  <text x="540" y="1655" text-anchor="middle" fill="#6f7787" font-size="24">Ücretsiz · Kayıt yok · Reklam yok · Telefonda da çalışır</text>
</svg>
